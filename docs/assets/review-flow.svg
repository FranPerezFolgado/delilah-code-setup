<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .bg    { font-family: system-ui,-apple-system,'Segoe UI',sans-serif; }
    .h1    { font: 700 24px system-ui,-apple-system,sans-serif; fill: #f1f5f9; }
    .sub   { font: 13px system-ui,-apple-system,sans-serif; fill: #64748b; }
    .mono  { font-family: 'SF Mono','Fira Code','Courier New',monospace; }
    .ct    { font: 700 17px system-ui,-apple-system,sans-serif; fill: #0f172a; }
    .cs    { font: 12px system-ui,-apple-system,sans-serif; fill: #94a3b8; }
    .el    { font: 700 13px system-ui,-apple-system,sans-serif; fill: #1e293b; }
    .es    { font: 11px system-ui,-apple-system,sans-serif; fill: #64748b; }
    .at    { font: 700 13px system-ui,-apple-system,sans-serif; fill: #ffffff; }
    .par   { font: 11px system-ui,-apple-system,sans-serif; fill: #94a3b8; }
    .il    { font: 700 11px system-ui,-apple-system,sans-serif; }
    .it    { font: 10.5px system-ui,-apple-system,sans-serif; }
    .bd    { font: 11px system-ui,-apple-system,sans-serif; }
    .vt    { font: 700 17px system-ui,-apple-system,sans-serif; fill: #0f172a; }
    .vr    { font: 700 13px system-ui,-apple-system,sans-serif; fill: #16a34a; }
    .va    { font: 700 13px system-ui,-apple-system,sans-serif; fill: #d97706; }
    .vw    { font: 700 13px system-ui,-apple-system,sans-serif; fill: #dc2626; }
    .vs    { font: 11px system-ui,-apple-system,sans-serif; fill: #64748b; }
    .ft    { font: 11px system-ui,-apple-system,sans-serif; fill: #94a3b8; }
  </style>
</defs>

<!-- Background -->
<rect width="1200" height="800" fill="#0d0d14"/>

<!-- Header -->
<text x="42" y="38" class="h1">Code Review — <tspan class="mono" fill="#a78bfa">/review</tspan> · <tspan class="mono" fill="#7dd3fc">/pr-review</tspan></text>
<text x="42" y="60" class="sub">4 specialist agents in parallel. /review runs immediately; /pr-review fetches PR metadata first.</text>

<!-- Main card -->
<rect x="28" y="72" width="1144" height="704" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

<!-- Card title -->
<text x="600" y="108" text-anchor="middle" class="ct">4 Subagents in Parallel — Consolidated Verdict</text>
<text x="600" y="128" text-anchor="middle" class="cs">Read-only · CRITICAL / HIGH / MEDIUM / LOW · auto-detects stack from file paths</text>

<!-- ── Entry boxes ── -->
<!-- /review box -->
<rect x="110" y="145" width="300" height="68" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="260" y="168" text-anchor="middle" class="el" font-family="'SF Mono','Fira Code','Courier New',monospace">/review</text>
<text x="260" y="186" text-anchor="middle" class="es" font-family="'SF Mono','Fira Code','Courier New',monospace">git diff main...HEAD</text>
<text x="260" y="202" text-anchor="middle" class="es">local changes or known PR number</text>

<!-- /pr-review box -->
<rect x="790" y="145" width="300" height="68" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
<text x="940" y="168" text-anchor="middle" class="el" font-family="'SF Mono','Fira Code','Courier New',monospace">/pr-review</text>
<text x="940" y="186" text-anchor="middle" class="es" font-family="'SF Mono','Fira Code','Courier New',monospace">gh pr view + gh pr diff</text>
<text x="940" y="202" text-anchor="middle" class="es">guided · fetches title, stats, description first</text>

<!-- Converging elbow lines -->
<polyline points="260,213 260,232 600,232" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
<polyline points="940,213 940,232 600,232" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="600" y1="232" x2="600" y2="255" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="610" y="252" class="par">parallel</text>

<!-- Branch lines to agents -->
<line x1="195" y1="262" x2="1005" y2="262" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="600" y1="255" x2="600" y2="262" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="195" y1="262" x2="195" y2="278" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="465" y1="262" x2="465" y2="278" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="735" y1="262" x2="735" y2="278" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="1005" y1="262" x2="1005" y2="278" stroke="#cbd5e1" stroke-width="1.5"/>

<!-- ── SECURITY BOX (x=70, y=278, w=250, h=215) ── -->
<rect x="70" y="278" width="250" height="215" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
<path d="M78,278 L312,278 Q320,278 320,286 L320,318 L70,318 L70,286 Q70,278 78,278 Z" fill="#dc2626"/>
<text x="195" y="303" text-anchor="middle" class="at">Security</text>
<text x="82" y="336" class="il" fill="#991b1b">Secrets &amp; credentials</text>
<text x="82" y="350" class="it" fill="#7f1d1d">Keys, tokens in source code</text>
<text x="82" y="368" class="il" fill="#991b1b">Injection</text>
<text x="82" y="382" class="it" fill="#7f1d1d">SQL raw, XSS, cmd inject</text>
<text x="82" y="400" class="il" fill="#991b1b">Auth &amp; authorisation</text>
<text x="82" y="414" class="it" fill="#7f1d1d">Missing checks, token misuse</text>
<text x="82" y="432" class="il" fill="#991b1b">Data exposure</text>
<text x="82" y="446" class="it" fill="#7f1d1d">PII logged, stack traces leaked</text>
<rect x="82" y="462" width="228" height="22" rx="4" fill="#fee2e2"/>
<text x="196" y="477" text-anchor="middle" class="bd" fill="#991b1b">CRITICAL → LOW · Sonnet</text>

<!-- ── CODE QUALITY BOX (x=340, y=278, w=250, h=215) ── -->
<rect x="340" y="278" width="250" height="215" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
<path d="M348,278 L582,278 Q590,278 590,286 L590,318 L340,318 L340,286 Q340,278 348,278 Z" fill="#d97706"/>
<text x="465" y="303" text-anchor="middle" class="at">Code Quality</text>
<text x="352" y="336" class="il" fill="#92400e">Correctness</text>
<text x="352" y="350" class="it" fill="#78350f">Logic errors, edge cases</text>
<text x="352" y="368" class="il" fill="#92400e">Error handling</text>
<text x="352" y="382" class="it" fill="#78350f">Silent catches, missing I/O</text>
<text x="352" y="400" class="il" fill="#92400e">SOLID principles</text>
<text x="352" y="414" class="it" fill="#78350f">SRP, OCP, DIP violations</text>
<text x="352" y="432" class="il" fill="#92400e">Anti-patterns</text>
<text x="352" y="446" class="it" fill="#78350f">God obj, magic numbers, feature envy</text>
<rect x="352" y="462" width="228" height="22" rx="4" fill="#fef3c7"/>
<text x="466" y="477" text-anchor="middle" class="bd" fill="#92400e">HIGH → LOW · Sonnet</text>

<!-- ── TESTS BOX (x=610, y=278, w=250, h=215) ── -->
<rect x="610" y="278" width="250" height="215" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
<path d="M618,278 L852,278 Q860,278 860,286 L860,318 L610,318 L610,286 Q610,278 618,278 Z" fill="#7c3aed"/>
<text x="735" y="303" text-anchor="middle" class="at">Tests</text>
<text x="622" y="336" class="il" fill="#4c1d95">Coverage</text>
<text x="622" y="350" class="it" fill="#4c1d95">New code without tests</text>
<text x="622" y="368" class="il" fill="#4c1d95">Edge cases</text>
<text x="622" y="382" class="it" fill="#4c1d95">Boundaries, error states missing</text>
<text x="622" y="400" class="il" fill="#4c1d95">Test quality</text>
<text x="622" y="414" class="it" fill="#4c1d95">Tautological, over-mocked</text>
<text x="622" y="432" class="il" fill="#4c1d95">Isolation</text>
<text x="622" y="446" class="it" fill="#4c1d95">Order-dependent, shared state</text>
<rect x="622" y="462" width="228" height="22" rx="4" fill="#ede9fe"/>
<text x="736" y="477" text-anchor="middle" class="bd" fill="#4c1d95">HIGH → LOW · Haiku</text>

<!-- ── ARCHITECTURE BOX (x=880, y=278, w=250, h=215) ── -->
<rect x="880" y="278" width="250" height="215" rx="8" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1"/>
<path d="M888,278 L1122,278 Q1130,278 1130,286 L1130,318 L880,318 L880,286 Q880,278 888,278 Z" fill="#0891b2"/>
<text x="1005" y="303" text-anchor="middle" class="at">Architecture</text>
<text x="892" y="336" class="il" fill="#164e63">Coupling</text>
<text x="892" y="350" class="it" fill="#164e63">Module dependencies introduced</text>
<text x="892" y="368" class="il" fill="#164e63">Pattern consistency</text>
<text x="892" y="382" class="it" fill="#164e63">Deviates from codebase conventions</text>
<text x="892" y="400" class="il" fill="#164e63">Breaking changes</text>
<text x="892" y="414" class="it" fill="#164e63">Public interface modified</text>
<text x="892" y="432" class="il" fill="#164e63">Abstractions</text>
<text x="892" y="446" class="it" fill="#164e63">YAGNI violations, leaky interfaces</text>
<rect x="892" y="462" width="228" height="22" rx="4" fill="#cffafe"/>
<text x="1006" y="477" text-anchor="middle" class="bd" fill="#164e63">HIGH → LOW · Sonnet</text>

<!-- Converging lines to verdict -->
<line x1="195" y1="493" x2="195" y2="516" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="465" y1="493" x2="465" y2="516" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="735" y1="493" x2="735" y2="516" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="1005" y1="493" x2="1005" y2="516" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="195" y1="516" x2="1005" y2="516" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="600" y1="516" x2="600" y2="530" stroke="#cbd5e1" stroke-width="1.5"/>

<!-- Verdict box -->
<rect x="180" y="530" width="840" height="112" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="600" y="558" text-anchor="middle" class="vt">Consolidated Verdict</text>

<rect x="200" y="568" width="240" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
<text x="320" y="593" text-anchor="middle" class="vr">✅  READY</text>
<text x="320" y="613" text-anchor="middle" class="vs">no CRITICAL or HIGH</text>

<rect x="480" y="568" width="240" height="62" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
<text x="600" y="593" text-anchor="middle" class="va">⚠️  NEEDS ATTENTION</text>
<text x="600" y="613" text-anchor="middle" class="vs">MEDIUM / LOW only</text>

<rect x="760" y="568" width="240" height="62" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
<text x="880" y="593" text-anchor="middle" class="vw">❌  NEEDS WORK</text>
<text x="880" y="613" text-anchor="middle" class="vs">CRITICAL or HIGH present</text>

<!-- Footer -->
<text x="600" y="666" text-anchor="middle" class="ft">Skills: /review (local or known PR number, immediate) · /pr-review (fetches PR metadata, guided)</text>
<text x="600" y="684" text-anchor="middle" class="ft">Agents: security-reviewer · code-quality-reviewer · architecture-reviewer (Sonnet) · test-reviewer (Haiku)</text>
<text x="600" y="702" text-anchor="middle" class="ft">All agents are read-only — no file modifications during review</text>

</svg>
